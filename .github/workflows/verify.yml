name: Verify portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare.mjs
      - run: dotnet build UmutOku.Portfolio.slnx -c Release
      - run: node --test tests/portfolio.test.mjs
      - run: node scripts/export.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-static
          path: artifacts/site
